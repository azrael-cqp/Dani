<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antrenament">
  <title>Antrenament — Daniel</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #020617; color: #e2e8f0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    button, input, select, textarea { font-family: inherit; }
    #root { min-height: 100vh; }
    #loading {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: #64748b; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="root"><div id="loading">SE INCARCA…</div></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    (function () {
      var names = ["app.compiled.js", "app_compiled.js"];
      var i = 0;
      function fail(msg) {
        document.getElementById("loading").innerHTML =
          '<div style="padding:24px;text-align:center;line-height:1.5"><div style="color:#ef4444;margin-bottom:12px">EROARE</div>' +
          '<div style="font-size:16px;font-weight:400;color:#cbd5e1">' + msg + '</div></div>';
      }
      function tryLoad() {
        if (i >= names.length) { fail("Nu gasesc fisierul aplicatiei. Trebuie sa fie <b>app.compiled.js</b> langa index.html, in radacina repo-ului."); return; }
        var s = document.createElement("script");
        s.src = names[i] + "?v=" + Date.now();
        s.onload = function () {
          try {
            ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
          } catch (e) { fail("Fisierul s-a incarcat (" + names[i] + ") dar aplicatia a crapat la pornire:<br>" + e.message); }
        };
        s.onerror = function () { i++; tryLoad(); };
        document.body.appendChild(s);
      }
      window.addEventListener("error", function (e) {
        if (e.message && document.getElementById("loading")) fail(e.message + "<br><small>" + (e.filename || "") + ":" + (e.lineno || "") + "</small>");
      });
      tryLoad();
    })();
  </script>
</body>
</html>
